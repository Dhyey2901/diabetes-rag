services:
  - type: web
    name: diabetes-rag
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python src/bm25.py && python src/embed_index.py
    startCommand: gunicorn "src.web_ui:create_app()" --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-3-27b-it:free
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: GEN_TOPK
        value: "4"
      - key: CONF_ABSTAIN
        value: "0.35"
      - key: SUPPORT_THRESHOLD
        value: "0.08"
